# ADAPT gz_topic_name to 'gz topic -l' after spawning robot.
# Never bridge the REAL /cmd_vel and SIM /cmd_vel to the same robot at once.
- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "/model/delivery_car_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/sim/odom"
  gz_topic_name: "/model/delivery_car_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

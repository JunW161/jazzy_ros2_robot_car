ekf_filter_node_v13:
  ros__parameters:
    # Robot_Delivery_V12/V13 hardware rates observed on the current robot:
    # /odom ~= 9.5-10 Hz, /imu/data_raw ~= 35-50 Hz depending on runtime load.
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true

    # SAFE COMPARISON MODE:
    # odom_tf_joint_bridge.py remains the sole owner of odom -> base_link.
    # Do NOT enable this until V13 has been validated on the floor.
    publish_tf: false
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    print_diagnostics: true
    debug: false
    use_control: false
    transform_time_offset: 0.0
    transform_timeout: 0.05

    # Never hide timestamp problems during validation.
    predict_to_current_time: false
    smooth_lagged_data: false

    # Current firmware derives pose/yaw/vx/wz from the same wheel encoders.
    # Avoid double-counting pose/yaw. For a differential-drive robot the
    # firmware also publishes linear.y = 0 with twist covariance[7] = 0.05,
    # so vy=0 is a valid non-holonomic constraint and is intentionally fused.
    # State order:
    # x,y,z,roll,pitch,yaw,vx,vy,vz,vroll,vpitch,vyaw,ax,ay,az
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # MPU-6500 is 6-axis. Firmware deliberately marks orientation unavailable
    # (orientation_covariance[0] < 0), therefore fuse angular_velocity.z only.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

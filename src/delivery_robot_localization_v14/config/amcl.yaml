amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    transform_tolerance: 0.5

    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: -1.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    lambda_short: 0.1
    do_beamskip: false

    # Robot runs slowly during commissioning, so update more often than Nav2 defaults.
    update_min_d: 0.10
    update_min_a: 0.10
    save_pose_rate: 0.5

    # First commissioning: set pose explicitly from RViz 2D Pose Estimate or set_initial_pose.py.
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    bond_heartbeat_period: 0.1

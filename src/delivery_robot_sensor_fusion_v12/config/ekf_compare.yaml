ekf_filter_node_v12:
  ros__parameters:
    # Robot_Delivery_V12 hardware rates: /odom ~=10 Hz, /imu/data_raw ~=50 Hz.
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true

    # SAFE COMPARISON MODE: current odom_tf_joint_bridge.py remains owner of
    # odom -> base_link. Do not create a second publisher for the same TF edge.
    publish_tf: false
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    print_diagnostics: true
    debug: false
    use_control: false
    transform_time_offset: 0.0
    transform_timeout: 0.05

    # Do not hide the previously observed source timestamp lag while validating.
    # After the source clock is corrected, this can be reevaluated separately.
    predict_to_current_time: false
    smooth_lagged_data: false

    # Wheel odometry comes from the same encoder source for x/y/yaw/vx/vyaw.
    # Fuse only body-forward velocity vx to avoid feeding duplicate information.
    # State order: x,y,z,roll,pitch,yaw,vx,vy,vz,vroll,vpitch,vyaw,ax,ay,az.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # MPU-6500 is 6-axis. Firmware intentionally publishes no orientation
    # quaternion (orientation_covariance[0] == -1). Fuse gyro Z only.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

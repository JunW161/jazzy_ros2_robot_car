# EXPERIMENTAL: do not use before navigation_full_v1 SAFE/REAL tests pass.
# Adds DWB local trajectory sampling and live obstacles to the global costmap.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true
      allow_unknown: false
      tolerance: 0.15
      use_final_approach_orientation: false
/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    robot_radius: 0.15
    footprint_padding: 0.01
    resolution: 0.05
    rolling_window: false
    track_unknown_space: true
    update_frequency: 2.0
    publish_frequency: 1.0
    transform_tolerance: 0.3
    always_send_full_costmap: false
    plugins:
    - static_layer
    - obstacle_layer
    - denoise_layer
    - inflation_layer
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      enabled: true
      map_topic: /map
      map_subscribe_transient_local: true
      subscribe_to_updates: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      enabled: true
      inflation_radius: 0.35
      cost_scaling_factor: 4.0
      inflate_unknown: false
      inflate_around_unknown: false
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      footprint_clearing_enabled: true
      combination_method: 1
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        marking: true
        clearing: true
        inf_is_valid: false
        observation_persistence: 0.0
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.05
        obstacle_max_range: 2.0
        raytrace_min_range: 0.05
        raytrace_max_range: 2.5
    denoise_layer:
      plugin: nav2_costmap_2d::DenoiseLayer
      enabled: true
      minimal_group_size: 2
      group_connectivity_type: 8
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    costmap_update_timeout: 0.5
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 5.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.18
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.18
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.35
      decel_lim_y: 0.0
      decel_lim_theta: -1.2
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      limit_vel_cmd_in_traj: false
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 24.0
      GoalAlign.scale: 18.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    robot_radius: 0.15
    footprint_padding: 0.01
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05
    track_unknown_space: false
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.3
    always_send_full_costmap: false
    plugins:
    - obstacle_layer
    - denoise_layer
    - inflation_layer
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      footprint_clearing_enabled: true
      combination_method: 1
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        marking: true
        clearing: true
        inf_is_valid: false
        observation_persistence: 0.0
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.05
        obstacle_max_range: 3.0
        raytrace_min_range: 0.05
        raytrace_max_range: 3.5
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      enabled: true
      inflation_radius: 0.35
      cost_scaling_factor: 4.0
      inflate_unknown: false
      inflate_around_unknown: false
    denoise_layer:
      plugin: nav2_costmap_2d::DenoiseLayer
      enabled: true
      minimal_group_size: 2
      group_connectivity_type: 8
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    enable_stamped_cmd_vel: false
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
      simulate_ahead_time: 1.5
      max_rotational_vel: 1.2
      min_rotational_vel: 1.1
      rotational_acc_lim: 1.0
    backup:
      plugin: nav2_behaviors::BackUp
      simulate_ahead_time: 1.0
      acceleration_limit: 0.3
      deceleration_limit: -0.35
      minimum_speed: 0.14
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
      simulate_ahead_time: 1.0
      acceleration_limit: 0.3
      deceleration_limit: -0.35
      minimum_speed: 0.14
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    transform_tolerance: 0.2
    bt_loop_duration: 10
    default_server_timeout: 20
    default_cancel_timeout: 20
    always_reload_bt_xml: false
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      enable_groot_monitoring: false
      groot_server_port: 1667
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      enable_groot_monitoring: false
      groot_server_port: 1669
    plugin_lib_names: []
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.35
    - 0.0
    - 1.2
    min_velocity:
    - -0.15
    - 0.0
    - -1.2
    max_accel:
    - 0.3
    - 0.0
    - 1.0
    max_decel:
    - -0.35
    - 0.0
    - -1.2
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false
    stamp_smoothed_velocity_with_smoothing_time: false
collision_monitor:
  ros__parameters:
    use_sim_time: false
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav_test
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.7
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    polygons:
    - StopCircle
    - SlowFront
    StopCircle:
      type: circle
      radius: 0.25
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_stop_zone
      enabled: true
    SlowFront:
      type: polygon
      points: '[[0.55, 0.28], [0.55, -0.28], [-0.10, -0.28], [-0.10, 0.28]]'
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.75
      visualize: true
      polygon_pub_topic: collision_slow_zone
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      enabled: true

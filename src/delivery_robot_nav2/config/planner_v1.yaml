planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true
      allow_unknown: false
      tolerance: 0.15
      use_final_approach_orientation: false

/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    robot_radius: 0.15
    footprint_padding: 0.01
    resolution: 0.05
    rolling_window: false
    track_unknown_space: true
    update_frequency: 2.0
    publish_frequency: 1.0
    transform_tolerance: 0.30
    always_send_full_costmap: false

    # TESTED WORKING FOR GLOBAL PLANNER:
    # use the saved static map and inflation only. Live /scan obstacles made
    # most of the global map lethal in this environment. Dynamic obstacle
    # handling is intentionally deferred to the controller's local costmap.
    plugins: ["static_layer", "inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      enabled: true
      map_topic: /map
      map_subscribe_transient_local: true
      subscribe_to_updates: true

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.35
      cost_scaling_factor: 4.0
      inflate_unknown: false
      inflate_around_unknown: false

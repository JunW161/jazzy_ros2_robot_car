velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.20]
    min_velocity: [-0.15, 0.0, -1.20]
    max_accel: [0.30, 0.0, 1.00]
    max_decel: [-0.35, 0.0, -1.20]
    odom_topic: /odometry/filtered
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50
    enable_stamped_cmd_vel: false
    stamp_smoothed_velocity_with_smoothing_time: false

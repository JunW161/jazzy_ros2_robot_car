controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    costmap_update_timeout: 0.5
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 5.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.18
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.25
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      lookahead_time: 1.2
      min_approach_linear_velocity: 0.14
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.8
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.14
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_angular_vel: 1.20
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 1.0
      transform_tolerance: 0.20
      stateful: true

/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    robot_radius: 0.15
    footprint_padding: 0.01
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05
    track_unknown_space: false
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.30
    always_send_full_costmap: false
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      footprint_clearing_enabled: true
      combination_method: 1
      # The user's installed Jazzy binary was verified to require a string here.
      observation_sources: "scan"
      scan:
        topic: /scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: false
        observation_persistence: 0.0
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.05
        obstacle_max_range: 3.00
        raytrace_min_range: 0.05
        raytrace_max_range: 3.50

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.35
      cost_scaling_factor: 4.0
      inflate_unknown: false
      inflate_around_unknown: false

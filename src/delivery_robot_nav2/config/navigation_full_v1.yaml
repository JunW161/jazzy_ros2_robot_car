planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true
      allow_unknown: false
      tolerance: 0.15
      use_final_approach_orientation: false

/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    robot_radius: 0.15
    footprint_padding: 0.01
    resolution: 0.05
    rolling_window: false
    track_unknown_space: true
    update_frequency: 2.0
    publish_frequency: 1.0
    transform_tolerance: 0.30
    always_send_full_costmap: false

    # TESTED WORKING FOR GLOBAL PLANNER:
    # use the saved static map and inflation only. Live /scan obstacles made
    # most of the global map lethal in this environment. Dynamic obstacle
    # handling is intentionally deferred to the controller's local costmap.
    plugins: ["static_layer", "inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      enabled: true
      map_topic: /map
      map_subscribe_transient_local: true
      subscribe_to_updates: true

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.35
      cost_scaling_factor: 4.0
      inflate_unknown: false
      inflate_around_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    costmap_update_timeout: 0.5
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 5.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.18
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.25
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      lookahead_time: 1.2
      min_approach_linear_velocity: 0.14
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.8
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.14
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_angular_vel: 1.20
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 1.0
      transform_tolerance: 0.20
      stateful: true

/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    robot_radius: 0.15
    footprint_padding: 0.01
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05
    track_unknown_space: false
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.30
    always_send_full_costmap: false
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      footprint_clearing_enabled: true
      combination_method: 1
      # The user's installed Jazzy binary was verified to require a string here.
      observation_sources: "scan"
      scan:
        topic: /scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: false
        observation_persistence: 0.0
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.05
        obstacle_max_range: 3.00
        raytrace_min_range: 0.05
        raytrace_max_range: 3.50

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.35
      cost_scaling_factor: 4.0
      inflate_unknown: false
      inflate_around_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.20
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 1.5
      max_rotational_vel: 1.20
      min_rotational_vel: 1.10
      rotational_acc_lim: 1.0

    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 1.0
      acceleration_limit: 0.30
      deceleration_limit: -0.35
      minimum_speed: 0.14

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      simulate_ahead_time: 1.0
      acceleration_limit: 0.30
      deceleration_limit: -0.35
      minimum_speed: 0.14

    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    transform_tolerance: 0.20
    bt_loop_duration: 10
    default_server_timeout: 20
    default_cancel_timeout: 20
    always_reload_bt_xml: false
    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1667

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1669

    # Jazzy loads built-in Nav2 BT node libraries automatically.

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.20]
    min_velocity: [-0.15, 0.0, -1.20]
    max_accel: [0.30, 0.0, 1.00]
    max_decel: [-0.35, 0.0, -1.20]
    odom_topic: /odometry/filtered
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50
    enable_stamped_cmd_vel: false
    stamp_smoothed_velocity_with_smoothing_time: false

collision_monitor:
  ros__parameters:
    use_sim_time: false
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav_test
    state_topic: collision_monitor_state
    transform_tolerance: 0.20
    source_timeout: 0.70
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false

    polygons: ["StopCircle", "SlowFront"]

    StopCircle:
      type: "circle"
      radius: 0.25
      action_type: "stop"
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_stop_zone
      enabled: true

    SlowFront:
      type: "polygon"
      points: "[[0.55, 0.28], [0.55, -0.28], [-0.10, -0.28], [-0.10, 0.28]]"
      action_type: "slowdown"
      min_points: 3
      slowdown_ratio: 0.75
      visualize: true
      polygon_pub_topic: collision_slow_zone
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      enabled: true
